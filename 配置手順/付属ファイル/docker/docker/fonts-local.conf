<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The invoice HTML asks for: "MS Gothic", "Meiryo", monospace.
       Those Windows fonts do not exist on Linux, so use IPAGothic (fixed width, Japanese). -->
  <alias binding="same">
    <family>MS Gothic</family>
    <prefer><family>IPAGothic</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>IPAGothic</family></prefer>
  </alias>
</fontconfig>
